pluginGroup=com.nodespark
pluginName=NodeSpark
pluginVersion=0.5.0

# Build variant. The test tree classes (com.intellij.execution.testframework.sm.*) live in the
# platform core classloader up to build 261, but 262 moved them into the separate Test Runner
# plugin (module intellij.platform.smRunner), which a plugin must declare to see them. A v2
# <dependencies><module/> block naming an unknown module makes the plugin fail to load, so one
# jar cannot serve both — build twice:
#   ./gradlew buildPlugin                    -> 241-261
#   ./gradlew buildPlugin -PideVariant=262   -> 262+
ideVariant=241

platformType=IC
platformVersion=2024.1.7
# 2026.2 is not published to the IntelliJ repository yet, so the 262 variant compiles against an
# installed IDE. Any 262+ install works (Ultimate is a superset of Community).
localIde262=C:/Program Files/JetBrains/IntelliJ IDEA 2026.2.1

# Gradle
org.gradle.caching=true
org.gradle.parallel=true
kotlin.stdlib.default.dependency=false

# No org.gradle.java.home here: it is machine-specific and would break every other clone.
# kotlin { jvmToolchain(21) } already compiles against a JDK 21 toolchain whatever JDK runs Gradle.
# Set it in ~/.gradle/gradle.properties if your default JDK is too old to run Gradle itself.
